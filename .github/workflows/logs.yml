name: Snake Engine Logs — readelf -sida / Ghidra (assemble only)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ghidra:
        description: Run Ghidra headless (heavy — not in Alpine PRoot)
        type: boolean
        default: true
      upload_artifact:
        description: Upload logs artifact
        type: boolean
        default: true

permissions:
  contents: read

# SOUL.md: Use GitHub Actions for assembling files only; CI uses a suitable environment.
# Alpine Linux via PRoot (aarch64) MUST NOT install heavy tools (e.g. Ghidra, JDK-bundled analyzers).
# All heavy assembly (Ghidra headless, full objdump -d, large-capstone) runs ONLY here.
concurrency:
  group: snake-logs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-logs:
    name: Assemble readelf -sida + Ghidra + Frida logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install tools (binutils + ripgrep + androguard + capstone + unicorn)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils ripgrep python3-pip
          pip install --quiet androguard capstone unicorn
          readelf --version | head -1
          rg --version
          python3 -c "import capstone; print('capstone', capstone.__version__)"
          androguard --version 2>&1 | head -1 || true

      - name: Set up Java 21 (Ghidra requires JDK 21+)
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Ghidra
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        uses: actions/cache@v4
        with:
          path: /tmp/ghidra
          key: ghidra-11.3.2-20250415

      - name: Download Ghidra (heavy — Actions only, never Alpine PRoot)
        continue-on-error: true
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        run: |
          set -euo pipefail
          if [ -d /tmp/ghidra/ghidra_11.3.2_PUBLIC ]; then
            echo "Ghidra cached"
            ls -d /tmp/ghidra/ghidra_* 2>&1 | head -5
            exit 0
          fi
          mkdir -p /tmp/ghidra
          echo "Downloading Ghidra 11.3.2 (~500MB) — heavy, Actions only..."
          curl -L --retry 3 --retry-delay 5 -o /tmp/ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip" || { echo "::warning::Ghidra download failed — capstone/objdump logs already cover static analysis; will retry next run via cache."; exit 0; }
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra || { echo "::warning::Ghidra unzip failed"; exit 0; }
          rm -f /tmp/ghidra.zip
          ls -lh /tmp/ghidra/ | head -20

      - name: Verify committed logs (no APK/SO in repo)
        run: |
          set -euo pipefail
          echo "Alpine PRoot must NOT install Ghidra — this job is the only place heavy tools run."
          # Core readelf -sida logs
          test -f logs/readelf/libengine-symbols.log
          test -f logs/readelf/libengine-sections.log
          test -f logs/readelf/libengine-dynamic.log
          test -f logs/readelf/libengine-relocs.log
          test -f logs/readelf/libapp-symbols.log
          test -f logs/readelf/libflutter-symbols.log
          # Ghidra / capstone (Actions-assembled; suitable env also produces capstone)
          test -f logs/ghidra/libengine-jni_onload-capstone.log
          test -f logs/ghidra/libengine-mytext-capstone.log
          test -f logs/ghidra/libengine-objdump-d.log
          # Missing-9 additions
          test -f logs/arsc/arsc-decoded.log
          test -f logs/apk-tree/apk-file-tree.log
          test -f logs/dex/full/classes-summary.log
          test -f logs/dex/ilil-call-sites.log
          test -f logs/dart/pool/apis.log
          test -f logs/dart/pool/snake-license.log
          test -f logs/manifest/risk/permissions-risk.log
          test -f logs/manifest/AndroidManifest-decoded.xml
          test -f docs/SnakeEngine_Analysis_Report.md
          test -f docs/SnakeEngine_DeepDive_ilil_Dart.md
          # Frida + Ghidra scripts
          test -f scripts/frida/dump_ilil.js
          test -f scripts/frida/frida_hook_all.js
          test -f scripts/ghidra/ghidra_headless.py
          test -f scripts/ci_collect_logs.sh
          # No-Frida runtime hooks (lightweight — allowed anywhere)
          test -f scripts/unicorn_dump_ilil.py
          test -f scripts/static_decrypt_ilil.py
          test -f logs/runtime/unicorn-ilil-dump.log
          test -f logs/runtime/hook-log.json
          test -f logs/runtime/static-ilil-decode.log
          # Live runtime dump (Shizuku/KSU — no Frida)
          test -f logs/runtime/live/jni-table-decrypted.log
          test -f logs/runtime/live/shizuku-live-ilil.log
          test -f logs/runtime/live/memscan-result.txt
          test -f logs/runtime/live/ptrfind-result.txt
          test -f logs/runtime/live/regionscan-result.txt
          test -f logs/runtime/live/pagestrings-result.txt
          test -f logs/runtime/live/memregion.bin.gz
          test -f scripts/shizuku/MemScan.java
          test -f scripts/shizuku/MemRegion.java
          test -f scripts/shizuku/PageStrings.java
          test -f scripts/shizuku/PtrFind.java
          test -f scripts/shizuku/IlilDump.java
          test -f scripts/shizuku_call_ilil.sh
          # coverage + ilil table hunt
          test -f logs/runtime/live/coverage-audit.log
          test -f logs/runtime/live/ilil-key-string-table.log
          test -f logs/runtime/live/rodata-blob-table.log
          test -f logs/runtime/live/memscan2-result.txt
          test -f logs/runtime/live/smallscan2-result.txt
          test -f scripts/shizuku/KeyScan.java
          test -f scripts/shizuku/SmallScan.java
          test -f logs/runtime/live/c2-and-sandbox-targets.log
          test -f logs/runtime/live/c2-assets/snakeengine_banner_8ballpool_1536x861.jpg
          test -f scripts/shizuku/CtxScan.java
          test -f scripts/shizuku/DexFind.java
          test -f logs/runtime/live/license-mechanism-install-launch-token.log
          test -f logs/runtime/live/inmem-dex-map.log
          test -f logs/runtime/live/sandbox-packagemanager-conf-paths.log
          test -f logs/runtime/live/dex-path-conf-evidence.log
          test -f logs/runtime/live/install-attempt-8ballpool.log
          test -f logs/runtime/live/target-catalog.txt
          test -f logs/runtime/live/c2-assets/install-blocked_no_subscription.png
          test -f logs/runtime/live/oldsnake-state/ANALYSIS.md
          test -f logs/runtime/live/oldsnake-state/package.conf
          test -f logs/runtime/live/oldsnake-state/inventory.txt
          test -f logs/runtime/live/oldsnake-state/payload-metadata.txt
          test -f logs/runtime/live/target-entry-and-version-mismatch.log
          test -f logs/runtime/live/target-entry-schema.txt
          echo "All committed logs + scripts present."
          if find . -maxdepth 4 -name "*.apk" -print -quit | grep -q .; then
            echo "::error::APK found in repo — logs-only, must not commit APK."
            exit 1
          fi
          if find . -maxdepth 4 -name "*.so" -print -quit | grep -q .; then
            echo "::warning::.so found in repo — prefer logs only."
          fi
          echo "Coverage: 9 missing pieces — see scripts/ci_collect_logs.sh"

      - name: Re-assemble logs summary (suitable env already built; re-verify)
        run: |
          set -euo pipefail
          echo "readelf -sida = -s (symbols) + -i (--all/notes) + -d (dynamic) + -a (all)"
          echo "Ghidra headless + Frida are heavy — assembled only here, never Alpine PRoot."
          echo "--- logs layout ---"
          ls -R logs 2>&1 | head -80
          echo "--- readelf -s sample (libengine JNI_OnLoad 0xF3FA0) ---"
          rg -n "JNI_OnLoad" logs/readelf/libengine-symbols.log || true
          echo "--- Ghidra capstone sample (mytext) ---"
          head -15 logs/ghidra/libengine-mytext-capstone.log || true
          echo "--- Dart pool sample (APIs) ---"
          head -15 logs/dart/pool/apis.log || true
          echo "--- Frida scripts ---"
          ls -lh scripts/frida/ scripts/ghidra/ 2>&1
          echo "--- APK tree sample ---"
          head -15 logs/apk-tree/apk-file-tree.log || true

      - name: Ghidra headless (when SO supplied as dispatch artifact — heavy)
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        run: |
          set -euo pipefail
          GHIDRA="/tmp/ghidra/ghidra_11.3.2_PUBLIC"
          if [ ! -d "$GHIDRA" ]; then
            echo "Ghidra not yet cached — will retry next run (download step above populates cache)"
            exit 0
          fi
          # Repo is logs-only; Ghidra runs only when SO is supplied as artifact (not committed)
          # Committed logs/ghidra/*.log are the assemble output from suitable env (capstone) + Actions (headless)
          echo "Ghidra headless ready at $GHIDRA"
          ls -lh "$GHIDRA/ghidraRun" 2>&1 | head -5
          if [ -f /tmp/libengine.so ] || [ -f /tmp/libapp.so ]; then
            echo "SO found — running analyzeHeadless..."
            for so in /tmp/libengine.so /tmp/libapp.so; do
              [ -f "$so" ] || continue
              python3 scripts/ghidra/ghidra_headless.py --ghidra "$GHIDRA" --so "$so" --out logs/ghidra/headless || true
            done
          else
            echo "No SO artifact — committed ghidra logs (capstone/objdump) are used."
            echo "Example when SO present:"
            echo "  \$GHIDRA/support/analyzeHeadless /tmp /tmp/ghidra_proj -import /tmp/libengine.so -processor AARCH64:LE:64:v8 -cspec default -analysisTimeoutPerFile 180"
          fi

      - name: Unicorn + Static hook-log runtime (No Frida — lightweight, allowed anywhere)
        run: |
          set -euo pipefail
          echo "Unicorn (pip) + static NEON replay — no Frida, no device, lightweight emulation"
          # APK is not committed; if release asset exists, fetch it — otherwise use committed SO if present
          # For now, try to run on committed logs only (no APK needed): just verify scripts exist
          test -f scripts/unicorn_dump_ilil.py
          test -f scripts/static_decrypt_ilil.py
          python3 -c "import unicorn, capstone; print('unicorn', unicorn.__version__, 'capstone', capstone.__version__)"
          # If APK/SO artifact is supplied (not committed), run the hooks
          if [ -f /tmp/libengine.so ]; then
            python3 scripts/unicorn_dump_ilil.py /tmp/libengine.so 2>&1 | tail -n 30 || true
            python3 scripts/static_decrypt_ilil.py /tmp/libengine.so 2>&1 | tail -n 30 || true
            ls -lh logs/runtime/ || true
          else
            echo "No /tmp/libengine.so — committed logs/runtime/ (unicorn+static) are used"
            echo "To run locally: python3 scripts/unicorn_dump_ilil.py path/to/Snake_Engine_2.2.6.apk"
            echo "Then: python3 scripts/static_decrypt_ilil.py path/to/Snake_Engine_2.2.6.apk"
            ls -R logs/runtime 2>&1 | head -n 40 || true
          fi

      - name: Log Frida usage (assemble Frida scripts as artifact)
        run: |
          set -euo pipefail
          echo "Frida scripts are pure JS — no heavy install needed (they run on device/emulator)."
          echo "See scripts/frida/dump_ilil.js — run: frida -U -f com.snake --no-pause -l scripts/frida/dump_ilil.js"
          echo "Heavy Ghidra headless stays here; Alpine PRoot only runs readelf/rg/capstone/androguard."

      - name: Upload logs artifact (assemble only)
        if: ${{ github.event_name == 'push' || inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: snake-engine-logs-${{ github.sha }}
          path: |
            logs/
            docs/
            scripts/
          if-no-files-found: error
          retention-days: 30
