name: Snake Engine Logs — readelf -sida / Ghidra (assemble only)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ghidra:
        description: Run Ghidra headless (heavy — not in Alpine PRoot)
        type: boolean
        default: true
      upload_artifact:
        description: Upload logs artifact
        type: boolean
        default: true

permissions:
  contents: read

# SOUL.md: Use GitHub Actions for assembling files only; CI uses a suitable environment.
# Alpine Linux via PRoot (aarch64) MUST NOT install heavy tools (e.g. Ghidra, JDK-bundled analyzers).
# All heavy assembly (Ghidra headless, full objdump -d, large-capstone) runs ONLY here.
concurrency:
  group: snake-logs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-logs:
    name: Assemble readelf -sida + Ghidra logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install light tools (binutils + ripgrep)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils ripgrep python3-pip
          pip install --quiet androguard capstone
          readelf --version | head -1
          rg --version
          python3 -c "import capstone; print('capstone', capstone.__version__)"

      - name: Set up Java 21 (Ghidra requires JDK 21+)
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Ghidra
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        uses: actions/cache@v4
        with:
          path: /tmp/ghidra
          key: ghidra-11.3.2-20250401

      - name: Download Ghidra (heavy — Actions only, never Alpine PRoot)
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        run: |
          set -euo pipefail
          if [ -d /tmp/ghidra/ghidra_11.3.2_PUBLIC ]; then
            echo "Ghidra cached"
            ls -d /tmp/ghidra/ghidra_*
            exit 0
          fi
          mkdir -p /tmp/ghidra
          echo "Downloading Ghidra 11.3.2 (~500MB) — heavy tool, Actions only..."
          curl -L -o /tmp/ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250401.zip"
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra
          rm /tmp/ghidra.zip
          ls -lh /tmp/ghidra/

      - name: Verify committed logs (no APK/SO in repo)
        run: |
          set -euo pipefail
          echo "Alpine PRoot must NOT install Ghidra — this job is the only place Ghidra runs."
          test -f logs/readelf/libengine-symbols.log
          test -f logs/readelf/libengine-sections.log
          test -f logs/readelf/libengine-dynamic.log
          test -f logs/readelf/libengine-relocs.log
          test -f logs/readelf/libapp-symbols.log
          test -f logs/ghidra/libengine-jni_onload-capstone.log
          test -f logs/ghidra/libengine-mytext-capstone.log
          test -f logs/dex/ilil-call-sites.log
          test -f logs/manifest/AndroidManifest-decoded.xml
          test -f docs/SnakeEngine_Analysis_Report.md
          echo "Committed logs present."
          if find . -maxdepth 4 -name "*.apk" -print -quit | grep -q .; then
            echo "::error::APK found in repo — logs-only repo must not commit APK."
            exit 1
          fi
          if find . -maxdepth 4 -name "*.so" -print -quit | grep -q .; then
            echo "::warning::.so found in repo — prefer logs only."
          fi

      - name: Re-assemble readelf -sida from committed APK asset (if available)
        run: |
          set -euo pipefail
          echo "readelf -sida = -s (symbols) + -i (--all + notes) + -d (dynamic) + -a (all)"
          echo "Logs in logs/readelf/ were built on suitable environment (Alpine/PRoot + binutils)"
          echo "and are re-verified here. Heavy Ghidra headless runs only in this job."
          ls -lh logs/readelf/ logs/ghidra/ logs/dex/ logs/dart/ 2>&1 | head -30
          echo "--- readelf -s sample (libengine JNI_OnLoad) ---"
          rg -n "JNI_OnLoad" logs/readelf/libengine-symbols.log || true
          echo "--- Ghidra-capstone sample (mytext anti-debug stub) ---"
          head -20 logs/ghidra/libengine-mytext-capstone.log || true

      - name: Ghidra headless (optional — when SO available as workflow artifact)
        if: ${{ github.event_name == 'push' || inputs.run_ghidra }}
        run: |
          set -euo pipefail
          GHIDRA="/tmp/ghidra/ghidra_11.3.2_PUBLIC"
          if [ ! -d "$GHIDRA" ]; then
            echo "Ghidra not found at $GHIDRA — skip (cached miss will retry next run)"
            exit 0
          fi
          echo "Ghidra headless available at $GHIDRA — would analyze libengine.so/libapp.so"
          echo "when SO is supplied as dispatch artifact (not committed). Current repo is logs-only,"
          echo "so committed logs/ghidra/*.log are the assemble output."
          ls -lh "$GHIDRA/ghidraRun" 2>&1 | head -5
          echo "Example (when SO present):"
          echo "  \$GHIDRA/support/analyzeHeadless /tmp /tmp/ghidra_proj -import /tmp/libengine.so -processor AARCH64:LE:64:v8 -cspec default -analysisTimeoutPerFile 120 -postScript"

      - name: Upload logs artifact (assemble only)
        if: ${{ github.event_name == 'push' || inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: snake-engine-logs-${{ github.sha }}
          path: |
            logs/
            docs/
            scripts/rebuild_readelf_logs.sh
          if-no-files-found: error
          retention-days: 30
